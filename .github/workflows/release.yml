# Release (M0-16, §5.3): tag v* -> build -> SBOM + build-provenance attestation -> PyPI.
# Publishing uses PyPI Trusted Publishing (OIDC; no stored token) and waits for the founder's
# approval on the protected `release` environment. Only repo admins can create v* tags (ruleset).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Sigstore signing for the build-provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.14"
          enable-cache: false
      - name: Tag must match the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('packages/python/pyproject.toml','rb'))['project']['version'])")
          if [ "v${version}" != "${TAG}" ]; then echo "tag ${TAG} does not match version ${version}"; exit 1; fi
      - name: Build sdist and wheel
        run: uv --directory packages/python build --out-dir "$GITHUB_WORKSPACE/dist"
      - name: SBOM (CycloneDX)
        run: |
          uv --directory packages/python sync --locked
          uv --directory packages/python run --locked cyclonedx-py environment --output-format JSON --output-file "$GITHUB_WORKSPACE/sbom.cdx.json"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://pypi.org/project/mnemowall/
    permissions:
      id-token: write # PyPI Trusted Publishing; PEP 740 attestations are generated by default
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
