[build-system]
# Pinned with the uv release; bump to 0.13.7 on/after 2026-11-10 (ADR-0011 cooldown).
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[project]
name = "mnemowall"
version = "0.0.1"
description = "A firewall plus version control for AI agent memory: provenance on every write, safer reads, rollback."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11,<3.15"
authors = [{ name = "The Mnemowall Authors" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Typing :: Typed",
]
# Core keeps a minimal dependency set and no default network access (§4). Each addition needs an ADR.
dependencies = [
  "google-re2==1.1.20251105",  # ADR-0017: linear-time regex for every content check
]

[project.urls]
Homepage = "https://mnemowall.com"
Source = "https://github.com/mnemowall/mnemowall-sdk"
Security = "https://github.com/mnemowall/mnemowall-sdk/security/policy"

[dependency-groups]
# Exact pins re-verified 2026-11-04; cooldown-cleared versions per ADR-0011 amendment 2026-11-05.
dev = [
  "ruff==0.17.3",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "hypothesis==6.170.13",
  "pip-audit==2.10.1",
  "cyclonedx-bom==7.6.0",
  "bandit==1.9.4",
]

[tool.uv]
# Wheels only for dependencies (§1.11, §5.3). M0-04: confirm the local project itself still builds with this set.
no-build = true
# 7-day release cooldown (ADR-0011): M0-04 sets `exclude-newer` to (lock date - 7 days) when uv.lock is first created.
exclude-newer = "2026-10-29T00:00:00Z"  # lock date 2026-11-05 minus 7 days

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "A", "C4", "PT", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["re2"]
ignore_missing_imports = true  # google-re2 ships no type stubs; wrapped in mnemowall.core.regex

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
xfail_strict = true
